<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>AirMate Service</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#000;--sec:rgba(60,60,67,.6);--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--blue:#007aff;--red:#ff3b30;--green:#34c759}
@media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1c1c1e;--label:#fff;--sec:rgba(235,235,245,.6);--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--blue:#0a84ff;--red:#ff453a;--green:#30d158}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--label);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12vh) 20px 40px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lock{width:76px;height:76px;border-radius:22px;background:linear-gradient(160deg,#e9eef5,#cfd8e3);display:grid;place-items:center;margin-bottom:18px}
@media (prefers-color-scheme: dark){.lock{background:linear-gradient(160deg,#3a3a3c,#232325)}}
h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:.3px}
p{color:var(--sec);font-size:15px;margin:0 0 26px}
.group{width:100%;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;position:relative;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
input[type=password]{flex:1;font:inherit;color:var(--label);background:transparent;border:0;outline:0;height:50px}
.sw{position:relative;width:51px;height:31px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:.2s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:.2s}
.sw input:checked+span{background:var(--green)}.sw input:checked+span::after{transform:translateX(20px)}
.btn{width:100%;height:50px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-family:inherit;font-size:17px;font-weight:600;margin-top:18px;cursor:pointer}
.btn:disabled{opacity:.4}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:12px}
.ft{color:var(--sec);font-size:13px;margin-top:22px;line-height:18px}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="wrap" id="w">
  <div class="lock"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1d2b3a" stroke-width="2" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="#1d2b3a"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></div>
  <h1>AirMate Service</h1>
  <p>Nur für das AirMate-Team.</p>
  <form id="f" class="group" autocomplete="on">
    <input type="text" name="username" value="airmate-service" autocomplete="username" hidden>
    <div class="row"><input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" required></div>
    <label class="row"><span style="flex:1">Auf diesem Handy merken</span><span class="sw"><input type="checkbox" id="rem" checked><span></span></span></label>
  </form>
  <button class="btn" id="go" form="f" type="submit">Entsperren</button>
  <div class="err" id="err"></div>
  <div class="ft">Die App ist verschlüsselt (AES-256). Ohne Passwort ist sie nicht lesbar.</div>
</div>
<script>
"use strict";
// Format app.enc: "AMS1" | Iterationen (uint32 BE) | Salt 16 | IV 12 | AES-256-GCM(gzip(app.html))
const DB = { open() { return new Promise((r, j) => { const q = indexedDB.open("am_svc", 1); q.onupgradeneeded = () => q.result.createObjectStore("k"); q.onsuccess = () => r(q.result); q.onerror = () => j(q.error); }); },
  async get() { try { const d = await this.open(); return await new Promise(r => { const q = d.transaction("k").objectStore("k").get("key"); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); } catch { return null; } },
  async set(v) { try { const d = await this.open(); d.transaction("k", "readwrite").objectStore("k").put(v, "key"); } catch {} },
  async del() { try { const d = await this.open(); d.transaction("k", "readwrite").objectStore("k").delete("key"); } catch {} } };
let BLOB = null;
async function blob() { if (BLOB) return BLOB; const r = await fetch("app.enc", { cache: "no-cache" }); if (!r.ok) throw new Error("app.enc fehlt"); BLOB = new Uint8Array(await r.arrayBuffer()); return BLOB; }
async function deriveKey(pw, b) {
  const it = (b[4] << 24 | b[5] << 16 | b[6] << 8 | b[7]) >>> 0, salt = b.slice(8, 24);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function decrypt(key, b) {
  if (String.fromCharCode(...b.slice(0, 4)) !== "AMS1") throw new Error("Unbekanntes Format");
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(24, 36), additionalData: b.slice(0, 24) }, key, b.slice(36));
  const ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(ds).text();
}
function run(html) { document.open(); document.write(html); document.close(); }
async function unlock(ev) {
  ev && ev.preventDefault(); const pw = document.getElementById("pw").value; if (!pw) return;
  const go = document.getElementById("go"), err = document.getElementById("err"); go.disabled = true; go.textContent = "Entschlüssle…"; err.textContent = "";
  try {
    const b = await blob(), key = await deriveKey(pw, b); let html;
    try { html = await decrypt(key, b); } catch { throw new Error("Passwort falsch"); }
    if (document.getElementById("rem").checked) await DB.set(key); else await DB.del();
    try { if (window.PasswordCredential) navigator.credentials.store(new PasswordCredential(document.getElementById("f"))); } catch {}
    run(html);
  } catch (e) {
    err.textContent = e.message; go.disabled = false; go.textContent = "Entsperren";
    const w = document.getElementById("w"); w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake");
  }
}
document.getElementById("f").addEventListener("submit", unlock);
(async () => {
  if (!crypto.subtle || !window.DecompressionStream) { document.getElementById("err").textContent = "Browser zu alt – bitte aktuelles Chrome verwenden."; return; }
  const key = await DB.get(); if (!key) return;
  try { run(await decrypt(key, await blob())); } catch { await DB.del(); }   // neue Version/neues Passwort -> erneut fragen
})();
</script>
</body>
</html>
